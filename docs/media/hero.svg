<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="680" viewBox="0 0 1280 680" role="img" aria-labelledby="title desc"><title id="title">JobLazy — Find it. Rate it. Make your move.</title><desc id="desc">Your job search in Codex or Claude Code. Find roles, see the fit, prepare and keep track.</desc><rect x="0" y="0" width="1280" height="680" rx="24" fill="#171B19" stroke="none"/><g transform="translate(52 42) scale(1)"><rect width="44" height="44" rx="12" fill="#EF713E"/><path d="M14 28L29 13M15 13H29V27" fill="none" stroke="#171B19" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></g><text x="112" y="75" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="650" fill="#F5F2EA" >JobLazy</text><text x="1224" y="70" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="500" fill="#B8BFB7" text-anchor="end" letter-spacing="2">YOUR CAREER. YOUR NEXT CHAPTER.</text><path d="M52 116H1228" stroke="#394039"/><text x="52" y="198" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="500" fill="#B8BFB7" letter-spacing="2.2">A JOB SEARCH WITH DIRECTION.</text><text x="46" y="295" font-family="Segoe UI,Arial,sans-serif" font-size="96" font-weight="650" fill="#F5F2EA" letter-spacing="-4">Find it.</text><text x="46" y="393" font-family="Segoe UI,Arial,sans-serif" font-size="96" font-weight="650" fill="#F5F2EA" letter-spacing="-4">Rate it.</text><text x="46" y="491" font-family="Segoe UI,Arial,sans-serif" font-size="96" font-weight="650" fill="#EF713E" letter-spacing="-4">Make your move.</text><text x="52" y="550" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="400" fill="#CFD3CB" >Your job search, in the chat you already use.</text><path d="M52 592H1228" stroke="#394039"/><text x="52" y="633" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="500" fill="#F5F2EA" letter-spacing="1.5">CODEX  /  CLAUDE CODE</text><text x="1228" y="633" font-family="Segoe UI,Arial,sans-serif" f