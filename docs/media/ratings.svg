<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc"><title id="title">The JobLazy rating system — illustrative example.</title><desc id="desc">Example only, not a real job: overall fit 84 out of 100, strong match. CV fit 4 of 5; career direction 5 of 5; compensation unknown; culture and working conditions 3 of 5; red flags 4 of 5. Overall fit is holistic, not an average or hiring probability.</desc><rect x="0" y="0" width="1280" height="640" rx="24" fill="#F3F1E9" stroke="none"/><text x="48" y="58" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="600" fill="#5A6257" letter-spacing="2">THE JOBLAZY RATING SYSTEM</text><text x="1230" y="58" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="500" fill="#6B6E65" text-anchor="end" letter-spacing="1">ILLUSTRATIVE EXAMPLE</text><rect x="36" y="94" width="418" height="506" rx="16" fill="#E6E8DF" stroke="none"/><text x="68" y="142" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="600" fill="#52604F" letter-spacing="2">OVERALL FIT</text><text x="60" y="297" font-family="Segoe UI,Arial,sans-serif" font-size="150" font-weight="600" fill="#202820" letter-spacing="-9">84</text><text x="247" y="287" font-family="Segoe UI,Arial,sans-serif" font-size="35" font-weight="400" fill="#677262" >/ 100</text><rect x="68" y="337" width="192" height="42" rx="21" fill="#D3DDCC" stroke="none"/><text x="91" y="365" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="600" fill="#324D30" >Strong match</text><text x="68" y="426" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="600" fill="#202820" >Know the fit.</text><text x="68" y="460" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="600" fill="#202820" >Understand the tradeoffs.</text><text x="68" y="528" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#5A6257" >A judgment of fit.</text><text x="68" y="555" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" fill="#5A6257" >Not your odds of getting hired.</text><text x="502" y="145" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="500" fill="#202820" >CV fit</text><text x="1230" y="145" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="600" fill="#202820" text-anchor="end">4 / 5</text><rect x="502" y="161" width="0" height="0" rx="0" fill="none" stroke="none"/><rect x="502" y="163" width="140.8" height="5" rx="2" fill="#526851" stroke="none"/><rect x="502" y="161" width="0" height="0" rx="0" fill="none" stroke="none"/><rect x="648.8" y="163" width="140.8" height="5" rx="2" fill="#526851" stroke="none"/><rect x="502" y="161" width="0" height="0" rx="0" fill="none" stroke="none"/><rect x="795.6" y="163" width="140.8" height="5" rx="2" fill="#526851" stroke="none"/><rect x="502" y="161" width="0" height="0" rx="0" fill="none" stroke="none"/><rect x="942.4000000000001" y="163" width="140.8" height="5" rx="2" fill="#526851" stroke="none"/><rect x="502" y="161" width="0" height="0" rx="0" fill="none" stroke="none"/><rect x="1089.2" y="163" width="140.8" height="5" rx="2" fill="#DDDCD3" stroke="none"/><text x="502" y="232" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="500" fill="#202820" >Career direction</text><text x="1230" y="232" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="600" fill="#202820" text-anchor="end">5 / 5</text><rect x="502" y="248" width="0" height="0" rx="0" fill="none" stroke="none"/><rect x="502" y="250" width="140.8" height="5" rx="2" fill="#526851" stroke="none"/><rect x="502" y="248" width="0" height="0" rx="0" fill="none" stroke="none"/><rect x="648.8" y="250" width="140.8" height="5" rx="2" fill="#526851" stroke="none"/><rect x="502" y="248" width="0" height="0" rx="0" fill="none" stroke="none"/><rect x="795.6" y="250" width="140.8" height="5" rx="2" fill="#526851" stroke="none"/><rect x="502" y="248" width="0" height="0" rx="0" fill="none" stroke="none"/><rect x="942.4000000000001" y="250" width="140.8" height="5" rx="2" fill="#526851" stroke="none"/><rect x="502" y="248" width="0" height="0" rx="0" fill="none" stroke="none"/><rect x="1089.2" y="250" width="140.8" height="5" rx="2" fill="#526851" stroke="none"/><text x="502" y="319" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="500" fill="#202820" >Compensation</text><text x="1230" y="319" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="600" fill="#6B6E65" text-anchor="end">Unknown</text><path d="M502 340H1230" stroke="#D7D8CF"/><text x="502" y="406" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="500" fill="#202820" >Culture &amp; working conditions</text><text x="1230" y="406" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="600" fill="#202820" text-anchor="end">3 / 5</text><rect x="502" y="422" width="0" height="0" rx="0" fill="none" stroke="none"/><rect x="502" y="424" width="140.8" height="5" rx="2" fill="#526851" stroke="none"/><rect x="502" y="422" width="0" height="0" rx="0" fill="none" stroke="none"/><rect x="648.8" y="424" width="140.8" height="5" rx="2" fill="#526851" stroke="none"/><rect x="502" y="422" width="0" height="0" rx="0" fill="none" stroke="none"/><rect x="795.6" y="424" width="140.8" height="5" rx="2" fill="#526851" stroke="none"/><rect x="502" y="422" width="0" height="0" rx="0" fill="none" stroke="none"/><rect x="942.4000000000001" y="424" width="140.8" height="5" rx="2" fill="#DDDCD3" stroke="none"/><rect x="502" y="422" width="0" height="0" rx="0" fill="none" stroke="none"/><rect x="1089.2" y="424" width="140.8" height="5" rx="2" fill="#DDDCD3" stroke="none"/><text x="502" y="493" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="500" fill="#202820" >Red flags</text><text x="1230" y="493" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="600" fill="#202820" text-anchor="end">4 / 5</text><rect x="502" y="509" width="0" height="0" rx="0" fill="none" stroke="none"/><rect x="502" y="511" width="140.8" height="5" rx="2" fill="#526851" stroke="none"/><rect x="502" y="509" width="0" height="0" rx="0" fill="none" stroke="none"/><rect x="648.8" y="511" width="140.8" height="5" rx="2" fill="#526851" stroke="none"/><rect x="502" y="509" width="0" height="0" rx="0" fill="none" stroke="none"/><rect x="795.6" y="511" width="140.8" height="5" rx="2" fill="#526851" stroke="none"/><rect x="502" y="509" width="0" height="0" rx="0" fill="none" stroke="none"/><rect x="942.4000000000001" y="511" width="140.8" height="5" rx="2" fill="#526851" stroke="none"/><rect x="502" y="509" width="0" height="0" rx="0" fill="none" stroke="none"/><rect x="1089.2" y="511" width="140.8" height="5" rx="2" fill="#DDDCD3" stroke="none"/><text x="502" y="594" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#5A6257" >1–5: higher is more favorable. Missing evidence stays Unknown.</text></svg>
