<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1090" viewBox="0 0 640 1090" role="img" aria-labelledby="title desc"><title id="title">The JobLazy rating system — illustrative example.</title><desc id="desc">Example only, not a real job: overall fit 84 out of 100, strong match. CV fit 4 of 5; career direction 5 of 5; compensation unknown; culture and working conditions 3 of 5; red flags 4 of 5. Higher is more favorable. Unknown means missing evidence.</desc><rect x="0" y="0" width="640" height="1090" rx="24" fill="#F3F1E9" stroke="none"/><text x="32" y="51" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="600" fill="#5A6257" letter-spacing="1">THE JOBLAZY RATING SYSTEM</text><text x="32" y="83" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="500" fill="#6B6E65" letter-spacing="1">ILLUSTRATIVE EXAMPLE</text><rect x="24" y="110" width="592" height="353" rx="16" fill="#E6E8DF" stroke="none"/><text x="50" y="155" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="600" fill="#52604F" letter-spacing="2">OVERALL FIT</text><text x="44" y="295" font-family="Segoe UI,Arial,sans-serif" font-size="132" font-weight="600" fill="#202820" letter-spacing="-8">84</text><text x="214" y="284" font-family="Segoe UI,Arial,sans-serif" font-size="33" font-weight="400" fill="#677262" >/ 100</text><rect x="365" y="234" width="200" height="44" rx="22" fill="#D3DDCC" stroke="none"/><text x="389" y="264" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="600" fill="#324D30" >Strong match</text><text x="50" y="360" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="600" fill="#202820" >Know the fit. See the tradeoffs.</text><text x="50" y="411" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#5A6257" >A judgment of fit. Not hiring odds.</text><text x="32" y="524" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="500" fill="#202820" >CV fit</text><